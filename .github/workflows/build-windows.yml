name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "gui.py"
      - "core/**"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build graphical executable
        run: pyinstaller --clean --noconfirm --onefile --windowed --name IPA64-Converter gui.py
      - name: Upload EXE
        uses: actions/upload-artifact@v5
        with:
          name: IPA64-Converter-Windows-GUI
          path: dist/IPA64-Converter.exe
          if-no-files-found: error
          retention-days: 14
